name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python and validate metadata
        run: |
          python -m compileall -q frappe_pawapay
          python - <<'PY'
          import json
          import pathlib
          import tomllib
          for path in pathlib.Path('.').rglob('*.json'):
              json.loads(path.read_text())
          tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          PY
      - name: Validate JavaScript syntax
        run: find frappe_pawapay -name '*.js' -print0 | xargs -0 -r -n 1 node --check
